<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>Makiiverse - Wii U Retro Devkit</title>
    <style type="text/css">
        body {
            background-color: #f4f1eb;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 40px;
        }
        .contenedor {
            background-color: #ffffff;
            border: 1px solid #cccccc;
            padding: 20px;
            width: 300px;
            margin: 0 auto;
            border-radius: 8px;
        }
        input {
            padding: 8px;
            font-size: 14px;
            width: 90%;
            margin-bottom: 10px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #71cc00;
            color: #ffffff;
            border: none;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
        }
        #espacioMii {
            margin-top: 20px;
            min-height: 140px;
        }
    </style>
</head>
<body>

    <div class="contenedor">
        <h2>Makiiverse (NetFront Fix)</h2>
        
        <input type="text" id="inputUsuario" value="YosMakii99_PN" />
        <br />
        <button onclick="renderizarMiiRetro()">Cargar Mii</button>
        
        <div id="espacioMii">
            <p style="color:#888; font-size:12px;">Esperando usuario...</p>
        </div>
    </div>

    <script type="text/javascript">
        function renderizarMiiRetro() {
            var input = document.getElementById("inputUsuario");
            var contenedor = document.getElementById("espacioMii");
            
            // Limpieza de espacios (metodo compatible con 2010)
            var usuario = input.value.replace(/^\s+|\s+$/g, '');
            
            if (usuario === "") {
                alert("Por favor, escribe un PNID.");
                return;
            }

            // Estado de carga inicial
            contenedor.innerHTML = "<p style='color:#666;'>Procesando...</p>";

            // 1. Construimos los parametros de la API (api_id=1 es para Pretendo)
            var parametros = "?nnid=" + encodeURIComponent(usuario) + "&type=face&width=270&api_id=1";
            
            // 2. Usamos HTTP INSEGURO para evitar el rechazo de certificados del navegador viejo
            var urlHttp = "http://mii-unsecure.ariankordi.net/miis/image.png" + parametros;
            
            // 3. Tambien preparamos el HTTPS por si GitHub Pages fuerza el bloqueo de contenido mixto
            var urlHttps = "https://mii-unsecure.ariankordi.net/miis/image.png" + parametros;

            // Creamos el elemento de imagen a la antigua
            var imagenMii = document.createElement("img");
            imagenMii.setAttribute("width", "140");
            imagenMii.setAttribute("height", "140");
            imagenMii.setAttribute("alt", "Mii");

            // Evento cuando la imagen carga bien
            imagenMii.onload = function() {
                contenedor.innerHTML = "";
                contenedor.appendChild(imagenMii);
            };

            // Evento por si el HTTP falla (ej. GitHub bloquea contenido inseguro)
            // Intentamos cargar por HTTPS como plan de respaldo
            imagenMii.onerror = function() {
                var imagenFallback = document.createElement("img");
                imagenFallback.setAttribute("width", "140");
                imagenFallback.setAttribute("height", "140");
                
                imagenFallback.onload = function() {
                    contenedor.innerHTML = "";
                    contenedor.appendChild(imagenFallback);
                };
                
                imagenFallback.onerror = function() {
                    contenedor.innerHTML = "<p style='color:red;'>El navegador de Wii U rechazo la conexion (SSL/CORS).</p>";
                };
                
                // Disparamos el segundo intento
                imagenFallback.src = urlHttps;
            };

            // Disparamos el primer intento (HTTP inseguro)
            imagenMii.src = urlHttp;
        }
    </script>

</body>
</html>
